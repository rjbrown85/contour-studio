<!doctype html><meta charset="utf-8"><title>Contour Studio browser checks</title>
<style>body{font:16px system-ui;background:#f7f7f2;color:#343630;margin:24px}iframe{border:1px solid #bbb;width:1024px;height:768px}li{margin:8px}.pass{color:#287445}.fail{color:#a32f20}</style>
<h1>Contour Studio browser checks</h1><p id="result">Running…</p><ol id="results"></ol><iframe title="Test canvas" src="/?test"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),list=document.querySelector('#results');let passed=0,failed=0
const pause=()=>new Promise(r=>setTimeout(r,50))
await new Promise(r=>frame.addEventListener('load',r,{once:true}));await pause()
const w=frame.contentWindow,d=w.document,stage=d.querySelector('#stage')
// Synthetic PointerEvents have no active native pointer, so capture is stubbed in this isolated test frame.
stage.setPointerCapture=()=>{}
const q=s=>d.querySelector(s),click=s=>q(s).click(),count=()=>q('#objects').children.length
const assert=(value,message)=>{if(!value)throw new Error(message)}
async function check(name,fn){try{await fn();list.insertAdjacentHTML('beforeend',`<li class="pass">PASS ${name}</li>`);passed++}catch(e){const li=document.createElement('li');li.className='fail';li.textContent=`FAIL ${name}: ${e.message}`;list.append(li);failed++}}
function point(x,y){const rect=stage.getBoundingClientRect(),v=stage.viewBox.baseVal;return {clientX:rect.left+(x-v.x)*rect.width/v.width,clientY:rect.top+(y-v.y)*rect.height/v.height}}
function event(type,x,y,id=1,pointerType='mouse',target=stage){target.dispatchEvent(new w.PointerEvent(type,{...point(x,y),pointerId:id,pointerType,button:0,buttons:type==='pointerup'?0:1,bubbles:true}))}
async function draw(tool,x1,y1,x2,y2){click(`[data-tool="${tool}"]`);event('pointerdown',x1,y1);event('pointermove',x2,y2);event('pointerup',x2,y2);await pause()}
click('#project');click('#new')
await check('box, oval, line, and smooth freehand create editable vector objects',async()=>{
 await draw('rect',100,100,300,250);await draw('ellipse',400,100,550,250);await draw('line',100,350,350,350);await draw('draw',500,400,650,500)
 assert(count()===4,'Expected four objects');assert(q('#objects path'),'Missing vector path');assert(q('#objects rect'),'Missing rectangle')
})
await check('undo and redo restore the drawing',async()=>{click('#undo');assert(count()===3,'Undo count');click('#redo');assert(count()===4,'Redo count')})
await check('selection moves and resizes, duplicates, recolours, and deletes',async()=>{
 click('[data-tool="select"]');let shape=q('#objects rect');event('pointerdown',150,150,1,'mouse',shape);event('pointermove',200,180);event('pointerup',200,180)
 assert(q('#objects > g').getAttribute('transform').includes('150 130'),'Move did not update position')
 let handle=q('[data-handle="resize"]');event('pointerdown',350,280,1,'mouse',handle);event('pointermove',450,380);event('pointerup',450,380)
 assert(q('#objects rect').getAttribute('width')==='300','Resize failed');click('[data-color="#bd6b53"]');assert(q('#objects > g > g').getAttribute('stroke')==='#bd6b53','Colour failed')
 click('#duplicate');assert(count()===5,'Duplicate failed');click('#delete');assert(count()===4,'Delete failed')
})
await check('two-finger pinch cancels a pending stroke and changes zoom',async()=>{
 click('[data-tool="draw"]');const before=count(),zoom=q('#zoom-label').textContent
 event('pointerdown',300,300,10,'touch');event('pointermove',320,320,10,'touch');event('pointerdown',600,600,11,'touch');event('pointermove',700,700,11,'touch');event('pointerup',700,700,11,'touch');event('pointerup',320,320,10,'touch')
 assert(count()===before,'Pinch left an accidental stroke');assert(q('#zoom-label').textContent!==zoom,'Pinch did not zoom');click('#fit')
})
await check('Pencil-only mode pans with fingers and draws with a pen',async()=>{
 click('#options');q('#pencil-only').checked=true;q('#pencil-only').dispatchEvent(new w.Event('change'));q('#options-dialog').close();const before=count()
 event('pointerdown',300,300,20,'touch');event('pointermove',400,400,20,'touch');event('pointerup',400,400,20,'touch');assert(count()===before,'Finger drew in Pencil-only mode')
 event('pointerdown',300,300,21,'pen');event('pointermove',400,400,21,'pen');event('pointerup',400,400,21,'pen');assert(count()===before+1,'Pen did not draw');click('#fit')
})
await check('cancelled pointer restores the pre-gesture drawing',async()=>{const before=count();event('pointerdown',300,300,22,'pen');event('pointermove',400,500,22,'pen');event('pointercancel',400,500,22,'pen');assert(count()===before,'Cancelled mark was retained')})
await check('text remains editable and safely renders literal markup',async()=>{
 click('[data-tool="text"]');event('pointerdown',700,150,1);event('pointerup',700,150,1);q('#text-content').value='<label & text>';q('#text-form').requestSubmit()
 assert(q('#objects text').textContent==='<label & text>','Text did not render literally');assert(!q('#objects label'),'Text became markup');click('#edit-text');q('#text-content').value='Hello';q('#text-form').requestSubmit();assert(q('#objects text').textContent==='Hello','Text edit failed')
})
await check('starting a new canvas is reversible',async()=>{const before=count();click('#project');click('#new');assert(count()===0,'New canvas not empty');click('#undo');assert(count()===before,'Undo did not restore previous drawing')})
await check('Save project uses the current name, and its downloaded file reopens',async()=>{
 let savedBlob,savedName;const originalCreate=w.URL.createObjectURL,originalClick=w.HTMLAnchorElement.prototype.click
 w.URL.createObjectURL=blob=>{savedBlob=blob;return originalCreate.call(w.URL,blob)}
 w.HTMLAnchorElement.prototype.click=function(){savedName=this.download}
 try{click('#project');q('#name').value='Round trip';click('#save-project')}finally{w.URL.createObjectURL=originalCreate;w.HTMLAnchorElement.prototype.click=originalClick}
 assert(savedName==='Round trip.contour.json','Saved filename did not use the current name')
 const contents=await savedBlob.text(),saved=JSON.parse(contents);assert(saved.name==='Round trip','Project name not saved');const before=count();click('#new');click('#project')
 const transfer=new w.DataTransfer();transfer.items.add(new w.File([contents],savedName,{type:'application/json'}));q('#file-input').files=transfer.files;q('#file-input').dispatchEvent(new w.Event('change'));await pause()
 assert(count()===before,'Import lost objects');assert(q('#project-name').textContent==='Round trip','Import lost project name')
})
await check('SVG parses as XML and rasterizes to a PNG',async()=>{
 const {exportSVG}=await import('../core.js'),doc=JSON.parse(w.localStorage.getItem('contour-studio.document.v1.test')),svg=exportSVG(doc)
 assert(!new DOMParser().parseFromString(svg,'image/svg+xml').querySelector('parsererror'),'Invalid SVG')
 const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),image=new Image();image.src=url;await image.decode()
 const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=900;canvas.getContext('2d').drawImage(image,0,0);assert(canvas.toDataURL().startsWith('data:image/png'),'PNG failed');URL.revokeObjectURL(url)
})
await check('pencil marks stay angular, eraser removes whole marks, and undo restores them',async()=>{
 click('#project');click('#new');await draw('pencil',100,100,300,200)
 assert(q('#objects path').getAttribute('d').includes('L'),'Pencil was smoothed')
 await draw('erase',200,150,220,160);assert(count()===0,'Eraser missed pencil');click('#undo');assert(count()===1,'Undo failed')
})
await check('object locks prevent drag, delete, recolour, and erasing',async()=>{
 click('[data-tool="select"]');event('pointerdown',150,125,1,'mouse',q('#objects path'));event('pointerup',150,125);click('#lock-object')
 const before=q('#objects').innerHTML;assert(q('#delete').disabled,'Delete enabled on locked object');assert(!q('[data-handle]'),'Locked handles visible')
 event('pointerdown',150,125,1,'mouse',q('#objects path'));event('pointermove',250,225);event('pointerup',250,225);click('[data-color="#bd6b53"]');assert(q('#objects').innerHTML===before,'Locked mark changed')
 await draw('erase',200,150,220,160);assert(count()===1,'Erased locked mark')
 click('[data-tool="select"]');event('pointerdown',150,125,1,'mouse',q('#objects path'));event('pointerup',150,125);click('#lock-object')
})
await check('layers hide, protect and move artwork, with reversible deletion',async()=>{
 click('#layers-toggle');assert(!q('#layers-panel').hidden,'Layers panel did not open');click('#add-layer');await draw('rect',400,100,600,300)
 const top=q('#layer-list [data-action="select"]').dataset.layer
 const layerAction=action=>click(`[data-layer="${top}"][data-action="${action}"]`)
 layerAction('visible');assert(count()===1,'Hidden layer still rendered');layerAction('visible');layerAction('lock');await draw('erase',400,200,400,220);assert(count()===2,'Locked layer erased')
 await draw('line',700,100,900,100);assert(count()===2,'Drew into locked layer');layerAction('lock')
 click('[data-tool="select"]');event('pointerdown',400,200,1,'mouse',q('#objects rect'));event('pointerup',400,200);click('#inspect-object');q('#object-layer').value='layer-1';click('#move-layer');layerAction('settings');click('#delete-layer');assert(count()===2,'Moving layer lost artwork');click('#undo');assert(q('#layer-count').textContent==='2','Layer delete undo failed');click('#close-layers')
})
await check('curves have editable controls and preserve their shape',async()=>{
 await draw('curve',100,500,400,500);assert(q('[data-handle="control-0"]'),'No curve handle');const path=q('#objects > g:last-child path'),before=path.getAttribute('d')
 const handle=q('[data-handle="control-0"]'),x=+handle.getAttribute('cx'),y=+handle.getAttribute('cy');event('pointerdown',x,y,1,'mouse',handle);event('pointermove',x,y+100);event('pointerup',x,y+100)
 assert(q('#objects > g:last-child path').getAttribute('d')!==before,'Curve edit did not apply')
})
await check('colour wheel, HEX, separate fill and outline, and brand palette work',async()=>{
 await draw('rect',700,400,900,600);click('[data-tool="select"]');event('pointerdown',700,450,1,'mouse',q('#objects > g:last-child rect'));event('pointerup',700,450)
 click('#colors');click('#target-fill');q('#hex-color').value='#2563eb';click('#apply-color');click('#save-brand-color');click('#target-stroke');q('#hex-color').value='#f97316';click('#apply-color')
 const paint=q('#objects > g:last-child > g');assert(paint.getAttribute('fill')==='#2563eb','Custom fill failed');assert(paint.getAttribute('stroke')==='#f97316','Separate outline failed');assert(q('#brand-colors [data-paint="#2563eb"]'),'Brand colour not saved')
 q('#color-wheel').setPointerCapture=()=>{};const r=q('#color-wheel').getBoundingClientRect();q('#color-wheel').dispatchEvent(new w.PointerEvent('pointerdown',{clientX:r.right,clientY:r.top+r.height/2,pointerId:90,bubbles:true}));q('#color-wheel').dispatchEvent(new w.PointerEvent('pointerup',{pointerId:90}));assert(/^#[0-9a-f]{6}$/.test(q('#hex-color').value),'Wheel produced invalid HEX');q('#colors-dialog').close()
})
await check('snap shapes tidies on lift and can restore the original stroke',async()=>{
 click('#snap-shapes');click('[data-tool="draw"]');event('pointerdown',100,700);for(let i=1;i<=15;i++)event('pointermove',100+i*15,700+Math.sin(i));event('pointerup',325,700)
 assert(q('#objects > g:last-child line'),'Rough line not tidied');assert(!q('#keep-original').hidden,'No keep-original option');click('#keep-original');assert(q('#objects > g:last-child path'),'Original not restored');click('#snap-shapes')
})
await check('holding a stroke tidies it before lifting',async()=>{
 click('#options');q('#hold-shapes').checked=true;q('#hold-shapes').dispatchEvent(new w.Event('change'));q('#options-dialog').close();click('[data-tool="pencil"]');event('pointerdown',500,700);for(let i=1;i<=15;i++)event('pointermove',500+i*15,700+Math.sin(i));await new Promise(r=>setTimeout(r,750));assert(q('#objects > g:last-child line'),'Hold did not tidy');event('pointerup',725,700)
 click('#options');q('#hold-shapes').checked=false;q('#hold-shapes').dispatchEvent(new w.Event('change'));q('#options-dialog').close()
})
await check('grid snaps geometry and stays out of exported artwork',async()=>{
 if(q('#grid-toggle').getAttribute('aria-pressed')!=='true')click('#grid-toggle');assert(q('#grid pattern'),'Grid missing');click('#options');q('#snap-grid').checked=true;q('#snap-grid').dispatchEvent(new w.Event('change'));q('#options-dialog').close();await draw('rect',113,313,267,467)
 assert(q('#objects > g:last-child').getAttribute('transform').includes('120 320'),'Grid start not snapped');assert(q('#objects > g:last-child rect').getAttribute('width')==='160','Grid end not snapped')
 await new Promise(r=>setTimeout(r,250));const {exportSVG}=await import('../core.js'),saved=JSON.parse(w.localStorage.getItem('contour-studio.document.v1.test'));assert(!exportSVG(saved).includes('grid-pattern'),'Export includes grid');assert(saved.layers.length===2&&saved.brandColors.includes('#2563eb'),'Project lost layers/palette')
 click('#options');q('#snap-grid').checked=false;q('#snap-grid').dispatchEvent(new w.Event('change'));q('#options-dialog').close()
})
await check('side scroll moves a zoomed canvas and Fit page restores the entire artboard',async()=>{
 click('#fit');click('#zoom-in');click('#zoom-in');const before=stage.viewBox.baseVal.y;click('#scroll-down');assert(stage.viewBox.baseVal.y>before,'Scroll arrow did not move canvas')
 const track=q('#scroll-track');track.setPointerCapture=()=>{};const r=track.getBoundingClientRect();track.dispatchEvent(new w.PointerEvent('pointerdown',{clientX:r.left+10,clientY:r.top+5,pointerId:80}));track.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:80}));assert(stage.viewBox.baseVal.y<before,'Scroll track failed');click('#fit');assert(q('#scroll-down').disabled,'Scroll active while entire page fits')
})
await check('tablet landscape, tablet portrait, and narrow layouts fit without overflow',async()=>{
 for(const [width,height] of [[1376,1032],[1376,900],[1032,1376],[1032,1200],[1024,768],[768,1024],[390,844]]){
  frame.style.width=width+'px';frame.style.height=height+'px';await pause()
  click('#fit');const inner=frame.contentDocument,viewport=frame.contentWindow.innerWidth
  assert(inner.documentElement.scrollHeight<=height,`Vertical overflow at ${width}x${height}`)
  const v=stage.viewBox.baseVal;assert(v.x<=0&&v.y<=0&&v.x+v.width>=1200&&v.y+v.height>=900,'Fit page clips artwork')
  assert(inner.documentElement.scrollWidth<=viewport,`Horizontal overflow at ${width}px`)
  for(const selector of ['.toolbar','.properties','#export','#stage']){const r=inner.querySelector(selector).getBoundingClientRect();assert(r.left>=0&&r.right<=viewport,`${selector} does not fit at ${width}px`)}
 }
 frame.style.width='768px';frame.style.height='1024px'
})
document.querySelector('#result').textContent=`${passed} passed, ${failed} failed`
</script>
